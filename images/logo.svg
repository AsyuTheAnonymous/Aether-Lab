  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#spec)" stroke-opacity=".55" stroke-width="1.5"/>
  <polygon points="32,7 13,29 28,34" fill="url(#facetA)"/>
  <polygon points="32,7 28,34 51,29" fill="url(#facetB)"/>
  <polygon points="13,29 28,34 32,57" fill="url(#facetC)"/>
