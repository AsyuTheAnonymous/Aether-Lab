<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aether Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120e2e"/>
      <stop offset="1" stop-color="#06050f"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2ff"/>
      <stop offset=".35" stop-color="#c49bff"/>
      <stop offset=".65" stop-color="#ff8fd8"/>
      <stop offset="1" stop-color="#ffd29a"/>
    </linearGradient>
    <linearGradient id="facetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="facetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fd8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c49bff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="facetC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8affc8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5ef2ff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="facetD" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd29a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff8fd8" stop-opacity=".3"/>
