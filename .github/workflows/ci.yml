name: CI

on:
  push:
    branches-ignore: [patcher-site]  # generated site, no tests to run
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every browser script
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run the test suite
        run: npm test
      - name: Build the patcher edition
        run: node tools/build-patcher.js dist/patcher
      - name: Smoke-test the static server
        run: |
          node server.js & sleep 1
          curl -fsS http://localhost:3000/ | grep -q "Aether Lab"
          curl -fsS -o /dev/null http://localhost:3000/js/app.js
          curl -fsS -o /dev/null http://localhost:3000/manifest.webmanifest
          curl -fsS -o /dev/null http://localhost:3000/images/logo.webp
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/package.json)" = "404"
